function has(k,t){return !k||norm(t).indexOf(k)>=0}
function workCards(list,k){
  let h="",cur="";
  list.forEach(function(r){
    const p=r.split("|");
    if(!has(k,p[1]))return;
    if(p[0]!==cur){if(cur)h+="</div>";h+='<h4 class="cnt">'+p[0]+'회</h4><div class="mg">';cur=p[0]}
    h+='<div class="mi"><b>'+esc(p[1])+'</b><span>'+p[2].split("").map(function(c){return LB[c]}).join(" · ")+'</span></div>';
  });
  return h?h+"</div>":'<div class="none">해당 없음</div>';
}
function peopleList(list,k){
  let h="";
  list.forEach(function(r){
    const p=r.split("|");
    if(!has(k,p[1]+p[2]))return;
    h+='<div class="pl"><b>'+esc(p[1])+'</b><i>'+p[0]+'회</i><span>'+esc(p[2].split("/").join(" · "))+'</span></div>';
  });
  return h||'<div class="none">해당 없음</div>';
}
function multiHtml(k){
  let h="";
  if(mode!=="T")h+="<h3>복수 선정 · 영화 작품</h3>"+workCards(WM,k);
  if(mode!=="M")h+="<h3>복수 선정 · TV 작품</h3>"+workCards(WT,k);
  h+="<h3>복수 선정 · 여자 배우</h3>"+peopleList(PF,k);
  h+="<h3>복수 선정 · 남자 배우</h3>"+peopleList(PM,k);
  let sy="";
  SY.forEach(function(r){
    const p=r.split("|");
    if(!has(k,p[1]+p[2]))return;
    sy+='<div class="pl"><b>'+esc(p[1])+'</b><i>'+p[3]+'년</i><span>'+esc(p[0]+" · "+p[2].split("/").join(" · "))+'</span></div>';
  });
  h+="<h3>동일 연도 복수 선정 · 배우</h3>"+(sy||'<div class="none">해당 없음</div>');
  h+="<h3>영화 부문 감독상 복수 선정</h3>"+peopleList(DR,k);
  return h;
}
function render(){
  Array.prototype.forEach.call(opts.children,function(b){b.className=b.dataset.m===mode?"on":""});
  const k=norm(q.value);
  Array.prototype.forEach.call(document.getElementById("views").children,function(b){b.className=b.dataset.v===view?"on":""});
  if(view==="multi"){out.innerHTML=multiHtml(k);return}
  if(view==="table"){out.innerHTML=tableHtml(k);return}
  if(!k){out.innerHTML='<div class="none">검색어를 입력하거나 위의 이름을 눌러 보세요.</div>';return}
  let html="",nM=0,nT=0,years=0;
  D.forEach(function(d){
    let rows="";
    [["M",d[1],ML],["T",d[2],TL]].forEach(function(s){
      if(mode!=="all"&&mode!==s[0]||!s[1])return;
      s[1].split("|").forEach(function(c,i){
        if(c&&norm(c).indexOf(k)>=0){
          const top=s[2][i].indexOf("작품상")===0?" top":"";
          rows+='<div class="row'+top+'"><span class="tag '+s[0]+'">'+(s[0]==="M"?"영화":"TV")+'</span><span class="k">'+s[2][i]+'</span><span class="nm">'+hl(c,k)+'</span></div>';
          if(s[0]==="M")nM++;else nT++;
        }
      });
    });
    if(rows){years++;html+='<section class="yr"><h2>'+d[0]+yl(d[0])+'</h2><div class="rows">'+rows+'</div></section>'}
  });
  if(!html){out.innerHTML='<div class="none">「'+esc(q.value)+'」에 해당하는 결과가 없어요.</div>';return}
  out.innerHTML='<div class="stats"><div class="stat hero"><b>'+(nM+nT)+'</b><span>총 선정 횟수</span></div><div class="stat"><b>'+nM+'</b><span>영화</span></div><div class="stat"><b>'+nT+'</b><span>TV</span></div></div>'+html;
}
