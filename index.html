function wl(y,t,i){const w=(WORK[y+t]||{})[i];return w?(Array.isArray(w)?w:[w]):[]}
function wmatch(y,t,i,k){return wl(y,t,i).some(function(w){return w&&norm(w).indexOf(k)>=0})}
function dec(y,t,i,c,k){
  if(!c)return "&ndash;";
  const ws=wl(y,t,i);
  if(!ws.length||i<2||(t==="M"&&i>=9))return k?hl(c,k):esc(c);
  const ps=c.split("/");
  if(ps.length>1&&ws.length===ps.length)return ps.map(function(p,j){return (k?hl(p,k):esc(p))+(ws[j]?' <span class="wk">('+(k?hl(ws[j],k):esc(ws[j]))+')</span>':"")}).join(" / ");
  const u=ws.filter(function(x){return x});
  return (k?hl(c,k):esc(c))+(u.length?' <span class="wk">('+u.map(function(x){return k?hl(x,k):esc(x)}).join(" / ")+')</span>':"");
}
function has(k,t){return !k||norm(t).indexOf(k)>=0}
function workCards(list,k){
  let h="",cur="";
  list.forEach(function(r){
    const p=r.split("|");
    if(!has(k,p[1]))return;
    if(p[0]!==cur){if(cur)h+="</div>";h+='<h4 class="cnt">'+p[0]+'회</h4><div class="mg">';cur=p[0]}
    h+='<div class="mi"><b>'+esc(p[1])+'</b><span>'+p[2].split("").map(function(c){return LB[c]}).join(" · ")+'</span></div>';
  });
  return h?h+"</div>":'<div class="none">해당 없음</div>';
}
function peopleList(list,k){
  let h="";
  list.forEach(function(r){
    const p=r.split("|");
    if(!has(k,p[1]+p[2]))return;
    h+='<div class="pl"><b>'+esc(p[1])+'</b><i>'+p[0]+'회</i><span>'+esc(p[2].split("/").join(" · "))+'</span></div>';
  });
  return h||'<div class="none">해당 없음</div>';
}
function multiHtml(k){
  let h="";
  if(mode!=="T")h+="<h3>복수 선정 · 영화 작품</h3>"+workCards(WM,k);
  if(mode!=="M")h+="<h3>복수 선정 · TV 작품</h3>"+workCards(WT,k);
  h+="<h3>복수 선정 · 여자 배우</h3>"+peopleList(PF,k);
  h+="<h3>복수 선정 · 남자 배우</h3>"+peopleList(PM,k);
  let sy="";
  SY.slice().sort(function(a,b){return b.split("|")[3]-a.split("|")[3]}).forEach(function(r){
    const p=r.split("|");
    if(!has(k,p[1]+p[2]))return;
    sy+='<div class="pl"><b>'+esc(p[1])+'</b><i>'+p[3]+'년</i><span>'+esc(p[2].split("/").join(" · "))+'</span></div>';
  });
  h+="<h3>동일 연도 복수 선정 · 배우</h3>"+(sy||'<div class="none">해당 없음</div>');
  h+="<h3>영화 부문 감독상 복수 선정</h3>"+peopleList(DR,k);
